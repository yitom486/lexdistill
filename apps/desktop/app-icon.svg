<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Amber Gold Essence Gradient -->
    <linearGradient id="goldEssence" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Funnel / Knowledge Strata Gradient -->
    <linearGradient id="strataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8a29e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Shadow / Bevel for squircle -->
    <linearGradient id="borderShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78716c" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#44403c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#292524" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Squircle Base (Apple/Fluent 22.5% curvature) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderShine)" stroke-width="3" />

  <!-- Subtle Ambient Glow behind droplet -->
  <circle cx="256" cy="310" r="90" fill="#f59e0b" opacity="0.15" filter="url(#coreGlow)" />

  <!-- Strata 1: Broad Knowledge Intake (为学日益 - Top Layer) -->
  <path d="M 120 125 C 180 140, 332 140, 392 125" fill="none" stroke="url(#strataGrad)" stroke-width="7" stroke-linecap="round" opacity="0.45" />

  <!-- Strata 2: Distilling Input (Mid-upper Layer) -->
  <path d="M 148 165 C 196 178, 316 178, 364 165" fill="none" stroke="url(#strataGrad)" stroke-width="8" stroke-linecap="round" opacity="0.65" />

  <!-- Strata 3: Converging Funnel (Mid Layer) -->
  <path d="M 180 205 C 215 216, 297 216, 332 205" fill="none" stroke="url(#goldEssence)" stroke-width="9" stroke-linecap="round" opacity="0.85" />

  <!-- Distillation Funnel Guide Lines (Sleek Geometric Convergence) -->
  <path d="M 120 125 L 216 265 C 228 282, 236 295, 236 320" fill="none" stroke="url(#goldEssence)" stroke-width="4.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 392 125 L 296 265 C 284 282, 276 295, 276 320" fill="none" stroke="url(#goldEssence)" stroke-width="4.5" stroke-linecap="round" opacity="0.4" />

  <!-- The Golden Essence Droplet (为道日损，凝练成滴 - The Distilled Pearl) -->
  <ellipse cx="256" cy="326" rx="46" ry="58" fill="url(#goldEssence)" opacity="0.25" filter="url(#coreGlow)" />

  <path d="M 256 242 
           C 256 242, 296 304, 296 338 
           C 296 360, 278 378, 256 378 
           C 234 378, 216 360, 216 338 
           C 216 304, 256 242, 256 242 Z" 
        fill="url(#goldEssence)" 
        stroke="#fef3c7" 
        stroke-width="2.5" />

  <!-- Droplet Internal High-Reflection Highlight (Crisp Clarity) -->
  <ellipse cx="244" cy="326" rx="12" ry="24" transform="rotate(-18 244 326)" fill="#ffffff" opacity="0.45" />
  <circle cx="266" cy="346" r="4" fill="#ffffff" opacity="0.6" />

  <!-- Subtle Base Ripple (以至于无为 - Natural Resonance) -->
  <ellipse cx="256" cy="412" rx="64" ry="10" fill="none" stroke="url(#goldEssence)" stroke-width="3" stroke-dasharray="8 6" opacity="0.35" />
  <ellipse cx="256" cy="424" rx="36" ry="6" fill="none" stroke="url(#goldEssence)" stroke-width="2" opacity="0.2" />
</svg>
